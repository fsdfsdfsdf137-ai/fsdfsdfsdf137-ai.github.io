<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Страница не найдена. Вернитесь на главную страницу портфолио Ярослава Закирова.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f7f8f6">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Страница не найдена — Ярослав Закиров</title>
  <style>
    :root{color-scheme:light;--bg:#f7f8f6;--text:#202522;--muted:#626a64;--green:#4b795d;--line:#e5e9e4}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "DM Sans","Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid #4b795d;outline-offset:4px;border-radius:4px}
    .top{height:78px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 max(24px,calc((100% - 1120px)/2))}
    .brand{font-weight:800;font-size:19px;letter-spacing:-.06em}
    .brand span{color:var(--green)}
    main{flex:1;display:grid;place-items:center;padding:64px 24px}
    .card{max-width:720px;text-align:center}
    .eyebrow{margin:0 0 18px;color:#355c44;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .code{font-size:clamp(96px,22vw,190px);line-height:.85;font-weight:800;letter-spacing:-.08em;color:#dfe8df;margin:0}
    h1{margin:24px 0 14px;font:800 clamp(32px,5vw,52px)/1.1 "Manrope","Segoe UI",Arial,sans-serif;letter-spacing:-.045em}
    p{max-width:520px;margin:0 auto;color:var(--muted);font-size:16px}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border:1px solid #dce2dd;border-radius:8px;font-size:14px;font-weight:700}
    .button-primary{background:var(--green);border-color:var(--green);color:#fff}
    .button-primary:hover{background:#355c44}
    .button-secondary:hover{background:#fff}
    footer{padding:22px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">Ярослав Закиров<span>.</span></a></header>
  <main>
    <div class="card">
      <p class="code" aria-hidden="true">404</p>
      <p class="eyebrow">Страница не найдена</p>
      <h1>Похоже, этой страницы<br>здесь нет.</h1>
      <p>Ссылка могла устареть или в адресе есть опечатка. Вернитесь на главную — там собраны работы и контакты.</p>
      <div class="actions">
        <a class="button button-primary" href="/">На главную</a>
        <a class="button button-secondary" href="/#projects">Смотреть работы</a>
      </div>
    </div>
  </main>
  <footer>Ярослав Закиров · Учебное портфолио</footer>
</body>
</html>
